name: Release

# Pushing a tag such as v0.2.0 builds every platform and publishes a GitHub Release.
# Running it by hand builds the same artifacts without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Load fontconfig at run time, so builds need no system fontconfig package.
  RUST_FONTCONFIG_DLOPEN: "1"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable; rustup default stable; rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --features gui --target ${{ matrix.target }}
      - run: Copy-Item target/${{ matrix.target }}/release/varco.exe varco-windows-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: varco-windows-${{ matrix.arch }}.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: aarch64-apple-darwin }
          - { arch: x64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --features gui --target ${{ matrix.target }}
      - name: Bundle varco.app
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP=varco.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/varco "$APP/Contents/MacOS/varco"
          sed "s/@VERSION@/$VERSION/" deploy/Info.plist > "$APP/Contents/Info.plist"
          cp assets/fonts/OFL-LICENSE.txt "$APP/Contents/Resources/NotoSansSC-OFL.txt"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" varco-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: varco-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static, no window: the server, and the client on headless machines.
          - { name: x64, target: x86_64-unknown-linux-musl, zig_target: x86_64-unknown-linux-musl, features: '' }
          - { name: arm64, target: aarch64-unknown-linux-musl, zig_target: aarch64-unknown-linux-musl, features: '' }
          # Window build, linked against an old glibc so it runs on most desktops.
          - { name: gui-x64, target: x86_64-unknown-linux-gnu, zig_target: x86_64-unknown-linux-gnu.2.31, features: '--features gui' }
          - { name: gui-arm64, target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.31, features: '--features gui' }
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Install cargo-zigbuild
        run: |
          python3 -m pip install --user --quiet ziglang
          cargo install --locked cargo-zigbuild
      - run: cargo zigbuild --locked --release ${{ matrix.features }} --target ${{ matrix.zig_target }}
      - run: cp target/${{ matrix.target }}/release/varco varco-linux-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: varco-linux-${{ matrix.name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes
