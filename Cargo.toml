[package]
name = "varco"
version = "1.0.1"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/tinymins/varco"
homepage = "https://lab.vmins.com/varco/"

[features]
default = []
gui = ["dep:slint", "dep:slint-build"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
bytes = "1"
dirs = "6"
gethostname = "1"
clap = { version = "4", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
portable-pty = "0.9"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2.8", features = ["async_tokio"] }
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-tcp-reno", "auto-icmp-echo-reply"] }
# The winit hooks are unstable across Slint minor releases, hence the tilde.
slint = { version = "~1.18", optional = true, default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-winit-software", "unstable-winit-030"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
argon2 = "0.6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[build-dependencies]
slint-build = { version = "~1.18", optional = true }
embed-manifest = "1"
embed-resource = "3.0.12"

# Password hashing is far too slow without optimization to test or develop with.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
panic = "abort"
