<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>varco 管理后台</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6c6c66; --line: #e2e2dc;
  --accent: #1f6f5c; --accent-text: #ffffff; --danger: #b3382c; --warn-bg: #fff4d6; --warn-text: #6b4e00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --panel: #20211f; --text: #ececE8; --muted: #a0a099; --line: #34352f;
    --accent: #4fb89f; --accent-text: #0c1a16; --danger: #ef8177; --warn-bg: #3c3216; --warn-text: #f1d98c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
[hidden] { display: none !important; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; }
nav { display: flex; gap: 4px; flex: 1; }
nav button { background: none; color: var(--muted); border: 0; white-space: nowrap; }
@media (max-width: 560px) {
  nav { order: 3; flex-basis: 100%; }
  #public-addr { flex: 1; min-width: 0; overflow-wrap: anywhere; }
}
nav button.active { color: var(--text); background: var(--bg); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
h2 { font-size: 15px; margin: 0 0 12px; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.chip strong { font-size: 16px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
td.wrap { white-space: normal; min-width: 140px; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
button { font: inherit; padding: 6px 12px; min-height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
td button + button { margin-left: 4px; }
form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
input, select, textarea { font: inherit; padding: 6px 8px; min-height: 32px; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
.wide { grid-column: 1 / -1; }
.reveal { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 12px; margin-top: 12px; }
.reveal code { display: block; word-break: break-all; margin: 8px 0; color: var(--text); }
.badge { display: inline-block; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; }
.badge.active { color: var(--accent); border-color: var(--accent); }
.badge.revoked, .badge.expired, .badge.used { color: var(--muted); }
#toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 480px; margin: 0 auto; background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 8px; }
#login { max-width: 360px; margin: 12vh auto; }
#login form { display: grid; gap: 12px; }
.empty { color: var(--muted); padding: 12px 8px; }
</style>
</head>
<body>

<div id="login" hidden>
  <section>
    <h2>varco 管理后台</h2>
    <form id="login-form">
      <label>用户名<input id="login-user" autocomplete="username" required></label>
      <label>密码<input id="login-pass" type="password" autocomplete="current-password"></label>
      <button class="primary">登录</button>
    </form>
  </section>
</div>

<div id="app" hidden>
  <header>
    <h1>varco</h1>
    <nav>
      <button data-tab="members" class="active">在线成员</button>
      <button data-tab="codes">Code</button>
      <button data-tab="bans">黑名单</button>
    </nav>
    <span class="muted mono" id="public-addr"></span>
    <button id="logout">退出</button>
  </header>
  <main>
    <div class="chips" id="networks"></div>

    <div data-panel="members">
      <section>
        <h2>在线成员</h2>
        <div class="scroll"><table id="members-table"></table></div>
        <p class="muted">踢出：断开并结束这次运行，对方重开程序后，只要 Code 还有效就能回来。要彻底拦住，请撤销 Code 并拉黑设备。</p>
      </section>
    </div>

    <div data-panel="codes" hidden>
      <section>
        <h2>生成 Code</h2>
        <form class="grid" id="code-form">
          <label>网络<select id="code-network" required></select></label>
          <label>类型
            <select id="code-kind">
              <option value="once">一次性（1 台设备）</option>
              <option value="timed">限时（到期前不限设备）</option>
            </select>
          </label>
          <label id="code-duration-field" hidden>有效时长<input id="code-duration" value="24h" placeholder="30m、24h、7d"></label>
          <label>备注<input id="code-note" placeholder="发给谁、做什么用"></label>
          <label class="wide">SSH 公钥（可选，对方确认后持有私钥的人能远程控制对方电脑）<input id="code-ssh" class="mono" placeholder="ssh-ed25519 AAAA…"></label>
          <div><button class="primary">生成</button></div>
        </form>
        <div class="reveal" id="code-reveal" hidden>
          <strong>Code 只显示这一次，请现在复制。</strong>
          <code class="mono" id="code-text"></code>
          <div id="code-key" class="mono"></div>
          <button id="code-copy" type="button">复制</button>
        </div>
      </section>
      <section>
        <h2>已生成的 Code</h2>
        <div class="scroll"><table id="codes-table"></table></div>
      </section>
      <section>
        <h2>配置文件里的永久凭证</h2>
        <p class="muted">只读。增删要改 <span class="mono">config.toml</span> 的 <span class="mono">credentials</span> 并重启服务。</p>
        <div class="scroll"><table id="credentials-table"></table></div>
      </section>
    </div>

    <div data-panel="bans" hidden>
      <section>
        <h2>添加黑名单</h2>
        <form class="grid" id="ban-form">
          <label>类型
            <select id="ban-kind">
              <option value="ip">IP 或网段</option>
              <option value="device">设备 ID</option>
            </select>
          </label>
          <label>内容<input id="ban-value" class="mono" required placeholder="203.0.113.7 或 198.51.100.0/24"></label>
          <label>备注<input id="ban-note"></label>
          <div><button class="primary">拉黑</button></div>
        </form>
        <p class="muted">立即断开匹配的连接。拉黑 IP 会影响同一出口后的所有人。设备 ID 由客户端上报，克隆的系统可能共用同一个 ID。</p>
      </section>
      <section>
        <h2>黑名单</h2>
        <div class="scroll"><table id="bans-table"></table></div>
      </section>
    </div>
  </main>
</div>

<div id="toast" hidden role="status"></div>

<script>
"use strict";
// Hostnames and notes come from clients and other people, so all text goes in
// through textContent. Paths are relative so the page works under a proxy prefix.
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "onclick") node.onclick = value;
    else if (key === "class") node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

let toastTimer;
function toast(message) {
  $("toast").textContent = message;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; }, 4000);
}

async function api(method, path, body) {
  const options = { method, credentials: "same-origin" };
  if (method !== "GET") {
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(body ?? {});
  }
  const response = await fetch("api/" + path, options);
  if (response.status === 401 && path !== "login") {
    showLogin();
    throw new Error("请先登录");
  }
  const text = await response.text();
  const data = text ? JSON.parse(text) : null;
  if (!response.ok) throw new Error(data?.error ?? "请求失败（" + response.status + "）");
  return data;
}

function act(run, done) {
  return async () => {
    try {
      await run();
      if (done) toast(done);
      await refresh();
    } catch (error) {
      toast(error.message);
    }
  };
}

const time = (seconds) => seconds ? new Date(seconds * 1000).toLocaleString("zh-CN", { hour12: false }) : "—";
const short = (text) => text ? text.slice(0, 8) : "—";

function fill(table, headers, rows, emptyText) {
  table.replaceChildren();
  if (!rows.length) {
    table.append(el("tr", {}, el("td", { class: "empty" }, emptyText)));
    return;
  }
  table.append(el("tr", {}, ...headers.map((h) => el("th", {}, h))));
  for (const row of rows) table.append(row);
}

function drawMembers(members) {
  fill($("members-table"),
    ["主机名", "网络", "虚拟 IP", "来源 IP", "设备", "Code", "上线时间", ""],
    members.map((m) => el("tr", {},
      el("td", {}, m.hostname),
      el("td", {}, m.network),
      el("td", { class: "mono" }, m.ip),
      el("td", { class: "mono" }, m.peer ?? "—"),
      el("td", { class: "mono", title: m.device ?? "这台设备没有上报 ID，不能按设备拉黑" }, m.device ? short(m.device) : "未知设备"),
      el("td", { class: "mono" }, m.code ? short(m.code) : "永久"),
      el("td", {}, time(m.since)),
      el("td", {},
        el("button", { class: "danger", onclick: () => {
          if (confirm("踢出 " + m.hostname + "？")) act(() => api("POST", "members/kick", { id: m.id }), "已踢出")();
        } }, "踢出"),
        ...(m.device ? [el("button", { class: "danger", onclick: () => {
          if (confirm("拉黑设备 " + m.hostname + "？这台设备重开程序或换 Code 都进不来。克隆的系统可能共用同一个 ID。")) {
            act(() => api("POST", "bans", { kind: "device", value: m.device, note: m.hostname }), "已拉黑设备")();
          }
        } }, "拉黑设备")] : []),
        ...(m.peer ? [el("button", { class: "danger", onclick: () => {
          if (confirm("拉黑 IP " + m.peer + "？同一出口后的所有人都会被断开。")) {
            act(() => api("POST", "bans", { kind: "ip", value: m.peer, note: m.hostname }), "已拉黑 IP")();
          }
        } }, "拉黑 IP")] : []),
      ),
    )),
    "现在没有人在线");
}

const STATUS = { active: "可用", used: "已使用", expired: "已过期", revoked: "已撤销" };

function drawCodes(codes) {
  fill($("codes-table"),
    ["ID", "网络", "类型", "状态", "备注", "使用者", "创建时间", ""],
    codes.map((c) => el("tr", {},
      el("td", { class: "mono", title: c.id }, short(c.id)),
      el("td", {}, c.network),
      el("td", {}, c.kind === "once" ? "一次性" : "至 " + time(c.expires_at)),
      el("td", {}, el("span", { class: "badge " + c.status }, STATUS[c.status] ?? c.status)),
      el("td", { class: "wrap" }, c.note || "—"),
      el("td", { class: "wrap" }, c.used_by.length
        ? c.used_by.map((u) => u.hostname + "（" + u.peer + "）").join("，")
        : "—"),
      el("td", {}, time(c.created_at)),
      el("td", {}, c.status === "revoked" ? "" : el("button", { class: "danger", onclick: () => {
        if (confirm("撤销这个 Code？用它进来的设备会被立即断开，且不能再连接。")) {
          act(() => api("POST", "codes/" + encodeURIComponent(c.id) + "/revoke"), "已撤销")();
        }
      } }, "撤销")),
    )),
    "还没有生成过 Code");
}

function drawBans(bans) {
  fill($("bans-table"),
    ["类型", "内容", "备注", "时间", ""],
    bans.map((b) => el("tr", {},
      el("td", {}, b.kind === "ip" ? "IP" : "设备"),
      el("td", { class: "mono", title: b.value }, b.kind === "ip" ? b.value : short(b.value)),
      el("td", { class: "wrap" }, b.note || "—"),
      el("td", {}, time(b.created_at)),
      el("td", {}, el("button", { onclick: () => {
        if (confirm("解除这条拉黑？")) act(() => api("DELETE", "bans/" + encodeURIComponent(b.id)), "已解除")();
      } }, "解除")),
    )),
    "黑名单是空的");
}

function drawOverview(overview) {
  $("public-addr").textContent = overview.public_addr;
  $("networks").replaceChildren(...overview.networks.map((n) => el("div", { class: "chip" },
    el("div", { class: "muted" }, n.name + " · " + n.cidr),
    el("strong", {}, String(n.online)),
    " / " + n.capacity + " 在线",
  )));
  const select = $("code-network");
  const names = overview.networks.map((n) => n.name);
  if ([...select.options].map((o) => o.value).join() !== names.join()) {
    const current = select.value;
    select.replaceChildren(...names.map((name) => el("option", {}, name)));
    if (names.includes(current)) select.value = current;
  }
  fill($("credentials-table"),
    ["网络", "指纹"],
    overview.credentials.map((c) => el("tr", {},
      el("td", {}, c.network),
      el("td", { class: "mono" }, c.fingerprint),
    )),
    "配置文件里没有永久凭证");
}

async function refresh() {
  const [overview, members, codes, bans] = await Promise.all([
    api("GET", "overview"), api("GET", "members"), api("GET", "codes"), api("GET", "bans"),
  ]);
  drawOverview(overview);
  drawMembers(members);
  drawCodes(codes);
  drawBans(bans);
}

let poll;
function showLogin() {
  clearInterval(poll);
  $("app").hidden = true;
  $("login").hidden = false;
  $("code-reveal").hidden = true;
  $("code-text").textContent = "";
}

function showApp() {
  $("login").hidden = true;
  $("app").hidden = false;
  clearInterval(poll);
  poll = setInterval(() => refresh().catch(() => {}), 5000);
}

document.querySelectorAll("nav button").forEach((button) => {
  button.onclick = () => {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b === button));
    document.querySelectorAll("[data-panel]").forEach((panel) => {
      panel.hidden = panel.dataset.panel !== button.dataset.tab;
    });
  };
});

$("login-form").onsubmit = async (event) => {
  event.preventDefault();
  try {
    await api("POST", "login", { username: $("login-user").value, password: $("login-pass").value });
    $("login-pass").value = "";
    await refresh();
    showApp();
  } catch (error) {
    toast(error.message);
  }
};

$("logout").onclick = async () => {
  try { await api("POST", "logout"); } catch (error) { toast(error.message); }
  showLogin();
};

$("code-kind").onchange = () => {
  $("code-duration-field").hidden = $("code-kind").value !== "timed";
};

$("code-form").onsubmit = async (event) => {
  event.preventDefault();
  try {
    const created = await api("POST", "codes", {
      network: $("code-network").value,
      kind: $("code-kind").value,
      duration: $("code-duration").value,
      note: $("code-note").value,
      ssh_pubkey: $("code-ssh").value,
    });
    $("code-text").textContent = created.code;
    $("code-key").textContent = created.key_fingerprint ? "可远程控制的公钥：" + created.key_fingerprint : "";
    $("code-reveal").hidden = false;
    $("code-note").value = "";
    $("code-ssh").value = "";
    await refresh();
  } catch (error) {
    toast(error.message);
  }
};

$("code-copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText($("code-text").textContent);
    toast("已复制");
  } catch {
    // The clipboard API needs HTTPS; selecting the text still lets it be copied.
    getSelection().selectAllChildren($("code-text"));
    toast("无法自动复制，已选中，请手动复制");
  }
};

$("ban-kind").onchange = () => {
  $("ban-value").placeholder = $("ban-kind").value === "ip" ? "203.0.113.7 或 198.51.100.0/24" : "64 位设备 ID";
};

$("ban-form").onsubmit = async (event) => {
  event.preventDefault();
  try {
    await api("POST", "bans", { kind: $("ban-kind").value, value: $("ban-value").value, note: $("ban-note").value });
    $("ban-value").value = "";
    $("ban-note").value = "";
    toast("已拉黑");
    await refresh();
  } catch (error) {
    toast(error.message);
  }
};

refresh().then(showApp).catch(() => showLogin());
</script>
</body>
</html>
